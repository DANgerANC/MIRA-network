[package]
name = "mira"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Standalone MIRA Core with CLI, system diagnostics and HTTP API"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.1"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
